<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Similarity Search</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  header { background: #1a1d27; padding: 20px 32px; border-bottom: 1px solid #2d3148; }
  header h1 { font-size: 1.5rem; color: #7c9fff; letter-spacing: 0.5px; }
  header p { font-size: 0.85rem; color: #888; margin-top: 4px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }

  .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 10px; padding: 24px; margin-bottom: 24px; }
  .card h2 { font-size: 1rem; color: #7c9fff; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }

  .input-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  textarea { flex: 1; min-width: 200px; background: #0f1117; border: 1px solid #3a3f5c; border-radius: 6px;
    color: #e0e0e0; padding: 10px 14px; font-size: 0.95rem; resize: vertical; min-height: 60px; }
  textarea:focus { outline: none; border-color: #7c9fff; }

  button { background: #4a6cf7; color: white; border: none; border-radius: 6px;
    padding: 10px 24px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
  button:hover { background: #6080ff; }
  button:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-secondary { background: #2d3148; }
  .btn-secondary:hover { background: #3a3f5c; }

  .hint { font-size: 0.78rem; color: #666; margin-top: 8px; }

  /* Profile summary */
  .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
  .profile-item { background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; padding: 10px 14px; }
  .profile-item .label { font-size: 0.72rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .profile-item .value { font-size: 1.1rem; color: #7c9fff; font-weight: 600; margin-top: 2px; }

  /* Results table */
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  thead th { background: #0f1117; padding: 10px 14px; text-align: right; color: #888;
    text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.5px; border-bottom: 1px solid #2d3148; }
  tbody tr { border-bottom: 1px solid #1e2130; transition: background 0.15s; }
  tbody tr:hover { background: #1e2130; }
  tbody td { padding: 10px 14px; vertical-align: top; }
  .rank-badge { display: inline-block; background: #4a6cf7; color: white; border-radius: 50%;
    width: 26px; height: 26px; line-height: 26px; text-align: center; font-size: 0.8rem; font-weight: 700; }
  .rank-badge.top { background: #f7a84a; }
  .sim-bar { height: 6px; background: #2d3148; border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .sim-fill { height: 100%; background: linear-gradient(90deg, #4a6cf7, #7c9fff); border-radius: 3px; transition: width 0.4s; }
  .members-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .member-chip { background: #2d3148; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; color: #aaa; }

  .detail-toggle { font-size: 0.78rem; color: #7c9fff; cursor: pointer; text-decoration: underline; margin-top: 6px; display: inline-block; }
  .detail-panel { display: none; background: #0f1117; border-radius: 6px; padding: 10px 14px; margin-top: 8px; font-size: 0.78rem; color: #aaa; }
  .detail-panel.open { display: block; }

  /* Chart */
  .chart-wrap { max-width: 700px; margin: 0 auto; }

  .error-msg { background: #2d1a1a; border: 1px solid #5c2d2d; border-radius: 6px; padding: 12px 16px; color: #ff8080; font-size: 0.88rem; }
  .loading { color: #7c9fff; font-size: 0.9rem; padding: 8px 0; }

  .persons-select { display: flex; flex-wrap: wrap; gap: 6px; max-height: 180px; overflow-y: auto;
    background: #0f1117; border: 1px solid #3a3f5c; border-radius: 6px; padding: 10px; margin-bottom: 8px; }
  .person-chip { background: #2d3148; border-radius: 4px; padding: 4px 10px; font-size: 0.82rem;
    cursor: pointer; user-select: none; transition: background 0.15s; }
  .person-chip:hover { background: #3a3f5c; }
  .person-chip.selected { background: #4a6cf7; color: white; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    background: #0f1117; border: 1px solid #2d3148; color: #888; transition: all 0.15s; }
  .tab.active { background: #4a6cf7; border-color: #4a6cf7; color: white; }
</style>
</head>
<body>
<header>
  <h1>Group Similarity Search</h1>
  <p>חיפוש קבוצות בעלות מאפיינים דומים על בסיס נתוני תקשורת, איכון וסייבר</p>
</header>

<div class="container">
  <!-- Input -->
  <div class="card">
    <h2>הגדרת קבוצת החיפוש</h2>
    <div id="personsLoading" class="loading">טוען רשימת אנשים...</div>
    <div id="personsPanel" style="display:none">
      <div id="personsContainer" class="persons-select"></div>
      <p class="hint">בחר אנשים מהרשימה, או הקלד IDs ישירות:</p>
    </div>
    <div class="input-row">
      <textarea id="idsInput" placeholder="לדוגמא: 1, 5, 12, 34" rows="2"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="searchBtn" onclick="doSearch()">חפש קבוצות דומות</button>
        <button class="btn-secondary" onclick="clearAll()">נקה</button>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorBox" class="error-msg" style="display:none;margin-bottom:16px"></div>

  <!-- Query profile -->
  <div id="profileCard" class="card" style="display:none">
    <h2>פרופיל קבוצת החיפוש</h2>
    <div id="profileGrid" class="profile-grid"></div>
  </div>

  <!-- Results -->
  <div id="resultsCard" class="card" style="display:none">
    <h2>10 הקבוצות הדומות ביותר</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('table')">טבלה</div>
      <div class="tab" onclick="switchTab('chart')">גרף השוואה</div>
    </div>

    <div id="tabTable">
      <table>
        <thead>
          <tr>
            <th>דירוג</th>
            <th>ציון דמיון</th>
            <th>גודל קבוצה</th>
            <th>חברי הקבוצה</th>
            <th>פרטים</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>

    <div id="tabChart" style="display:none">
      <div class="chart-wrap">
        <canvas id="radarChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
let allPersons = [];
let selectedIds = new Set();
let radarChart = null;
let lastResults = null;
let lastQuerySummary = null;

async function loadPersons() {
  try {
    const resp = await fetch('/api/persons');
    allPersons = await resp.json();
    renderPersonChips();
    document.getElementById('personsLoading').style.display = 'none';
    document.getElementById('personsPanel').style.display = 'block';
  } catch(e) {
    document.getElementById('personsLoading').textContent = 'שגיאה בטעינת אנשים';
  }
}

function renderPersonChips() {
  const container = document.getElementById('personsContainer');
  container.innerHTML = '';
  allPersons.forEach(p => {
    const chip = document.createElement('div');
    chip.className = 'person-chip' + (selectedIds.has(p.id) ? ' selected' : '');
    chip.textContent = `${p.id} — ${p.name}`;
    chip.onclick = () => togglePerson(p.id, chip);
    container.appendChild(chip);
  });
}

function togglePerson(id, chip) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
    chip.classList.remove('selected');
  } else {
    selectedIds.add(id);
    chip.classList.add('selected');
  }
  syncInput();
}

function syncInput() {
  document.getElementById('idsInput').value = [...selectedIds].sort((a,b)=>a-b).join(', ');
}

function clearAll() {
  selectedIds.clear();
  document.getElementById('idsInput').value = '';
  renderPersonChips();
  document.getElementById('profileCard').style.display = 'none';
  document.getElementById('resultsCard').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
}

async function doSearch() {
  const raw = document.getElementById('idsInput').value;
  const ids = raw.split(/[\s,]+/).map(s=>parseInt(s.trim())).filter(n=>!isNaN(n));
  if (!ids.length) { showError('נא להזין לפחות ID אחד'); return; }

  document.getElementById('searchBtn').disabled = true;
  document.getElementById('searchBtn').textContent = 'מחפש...';
  document.getElementById('errorBox').style.display = 'none';

  try {
    const resp = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({person_ids: ids})
    });
    const data = await resp.json();
    if (!resp.ok) { showError(data.detail || 'שגיאה'); return; }
    renderResults(data);
  } catch(e) {
    showError('שגיאת רשת: ' + e.message);
  } finally {
    document.getElementById('searchBtn').disabled = false;
    document.getElementById('searchBtn').textContent = 'חפש קבוצות דומות';
  }
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}

const FEATURE_LABELS = {
  avg_call_duration: 'משך שיחה ממוצע (שנ׳)',
  calls_per_day: 'שיחות ליום',
  unique_contacts: 'אנשי קשר ייחודיים',
  night_activity_ratio: 'פעילות לילית',
  sms_ratio: 'יחס SMS',
  movement_radius: 'רדיוס תנועה',
  unique_locations: 'מיקומים ייחודיים',
  travel_frequency: 'תדירות נסיעות',
  home_lat_norm: 'קו רוחב ממוצע',
  home_lon_norm: 'קו אורך ממוצע',
  unique_domains_per_day: 'דומיינים ייחודיים/יום',
  avg_data_volume_kb: 'נפח נתונים ממוצע (KB)',
  https_ratio: 'יחס HTTPS',
  cyber_active_hours: 'שעות פעילות סייבר',
  cyber_events_per_day: 'אירועי סייבר/יום',
};

function renderResults(data) {
  lastResults = data.results;
  lastQuerySummary = data.query_profile_summary;

  // Profile card
  const grid = document.getElementById('profileGrid');
  grid.innerHTML = '';
  Object.entries(data.query_profile_summary).forEach(([k, v]) => {
    if (['home_lat_norm','home_lon_norm'].includes(k)) return;
    const div = document.createElement('div');
    div.className = 'profile-item';
    div.innerHTML = `<div class="label">${FEATURE_LABELS[k]||k}</div><div class="value">${v}</div>`;
    grid.appendChild(div);
  });
  document.getElementById('profileCard').style.display = 'block';

  // Results table
  const tbody = document.getElementById('resultsBody');
  tbody.innerHTML = '';
  data.results.forEach(r => {
    const tr = document.createElement('tr');
    const members = r.members.slice(0, 15).map(id => `<span class="member-chip">${id}</span>`).join('');
    const more = r.members.length > 15 ? `<span class="member-chip">+${r.members.length-15}</span>` : '';
    const simPct = (r.similarity * 100).toFixed(1);
    const badgeClass = r.rank <= 3 ? 'rank-badge top' : 'rank-badge';

    const profileEntries = Object.entries(r.profile_summary)
      .filter(([k]) => !['home_lat_norm','home_lon_norm'].includes(k))
      .map(([k,v]) => `<b>${FEATURE_LABELS[k]||k}:</b> ${v}`).join(' &nbsp;|&nbsp; ');

    tr.innerHTML = `
      <td><span class="${badgeClass}">${r.rank}</span></td>
      <td>
        <span style="font-weight:600;color:#7c9fff">${simPct}%</span>
        <div class="sim-bar"><div class="sim-fill" style="width:${simPct}%"></div></div>
      </td>
      <td style="color:#aaa">${r.size} אנשים</td>
      <td><div class="members-list">${members}${more}</div></td>
      <td>
        <span class="detail-toggle" onclick="toggleDetail(this)">הצג פרופיל ▾</span>
        <div class="detail-panel">${profileEntries}</div>
      </td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('resultsCard').style.display = 'block';

  buildRadarChart(data);
}

function toggleDetail(el) {
  const panel = el.nextElementSibling;
  panel.classList.toggle('open');
  el.textContent = panel.classList.contains('open') ? 'הסתר ▴' : 'הצג פרופיל ▾';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (tab==='table')));
  document.getElementById('tabTable').style.display = tab === 'table' ? '' : 'none';
  document.getElementById('tabChart').style.display = tab === 'chart' ? '' : 'none';
}

function buildRadarChart(data) {
  const keys = Object.keys(data.query_profile_summary).filter(k => !['home_lat_norm','home_lon_norm'].includes(k));
  const labels = keys.map(k => FEATURE_LABELS[k] || k);

  const queryVals = keys.map(k => data.query_profile_summary[k]);
  const top3 = data.results.slice(0, 3);

  // Normalize to [0,1] per feature across all shown series
  const allVals = [queryVals, ...top3.map(r => keys.map(k => r.profile_summary[k]))];
  const maxPerFeature = keys.map((_, i) => Math.max(...allVals.map(v => Math.abs(v[i]))) || 1);
  const normalize = vals => vals.map((v, i) => v / maxPerFeature[i]);

  const colors = ['#7c9fff', '#f7a84a', '#4af79c', '#f74a7c'];
  const datasets = [
    { label: 'קבוצת החיפוש', data: normalize(queryVals), borderColor: colors[0], backgroundColor: colors[0]+'33', pointBackgroundColor: colors[0] },
    ...top3.map((r, i) => ({
      label: `דירוג ${r.rank} (${(r.similarity*100).toFixed(1)}%)`,
      data: normalize(keys.map(k => r.profile_summary[k])),
      borderColor: colors[i+1], backgroundColor: colors[i+1]+'22', pointBackgroundColor: colors[i+1]
    }))
  ];

  if (radarChart) radarChart.destroy();
  const ctx = document.getElementById('radarChart').getContext('2d');
  radarChart = new Chart(ctx, {
    type: 'radar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#aaa', font: { size: 11 } } } },
      scales: {
        r: {
          ticks: { color: '#666', backdropColor: 'transparent', font: { size: 9 } },
          grid: { color: '#2d3148' },
          pointLabels: { color: '#888', font: { size: 9 } },
          min: 0, max: 1,
        }
      }
    }
  });
}

loadPersons();
</script>
</body>
</html>
